name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: monierave
          POSTGRES_PASSWORD: monierave
          POSTGRES_DB: monierave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U monierave -d monierave_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_SOURCE: "postgresql://monierave:monierave@localhost:5432/monierave_test?sslmode=disable"
      DB_TEST_SOURCE: "postgresql://monierave:monierave@localhost:5432/monierave_test?sslmode=disable"
      SERVER_ADDRESS: "0.0.0.0:8080"
      SECRET_KEY: "12345678901234567890123456789012"
      ACCESS_TOKEN_DURATION: "15m"
      REFRESH_TOKEN_DURATION: "24h"
      REFRESH_COOKIE_NAME: "monierave_refresh"
      REFRESH_COOKIE_DOMAIN: ""
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAME_SITE: "lax"
      ALLOWED_ORIGINS: "http://localhost:3000"
      REDIS_ADDRESS: "localhost:6379"
      MAILER_PROVIDER: "log"
      WORKER_CONCURRENCY: "10"
      RELAY_BATCH_SIZE: "50"
      RELAY_POLL_INTERVAL: "1s"
      RELAY_CLAIM_LEASE: "30s"
      PUBLIC_API_URL: "http://localhost:8080"
      EMAIL_VERIFICATION_DURATION: "24h"
      ENFORCE_EMAIL_VERIFICATION: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install golang migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar -xz
          sudo install migrate /usr/local/bin/migrate

      - name: Run migrations
        run: migrate -path db/migration -database "$DB_SOURCE" -verbose up

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build application
        run: go build -v ./...

      - name: Run tests
        run: go test -race -cover ./...

      - name: Build production image
        run: docker build --tag monierave:ci .
